<!doctype html><html lang="en"><head>

    <meta charset="utf-8">
<title>Lock Screen | Dreams Core - Tailwind Admin Template</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta content="Dreams Core is a modern, feature-rich Tailwind CSS admin dashboard template with a wide range of ready-to-use pages, components, and layouts for building web applications." name="description">
<meta content="Dreams Technologies" name="author">

    <!-- Favicon -->
<link rel="shortcut icon" type="image/x-icon" href="assets/favicon-BfZIYWJw.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-z_cRtcRT.png">















  <script type="module" crossorigin="" src="assets/script-CFI7pXVP.js"></script>
  <link rel="stylesheet" crossorigin="" href="assets/script-DbEScXyL.css">
</head>

<body>

    <div class="min-h-screen flex items-center justify-center p-6 bg-sunken relative overflow-hidden">

        <div class="absolute -top-24 -left-24 size-72 rounded-full pointer-events-none bg-[var(--color-primary-300)] opacity-[0.25] blur-[70px]"></div>
        <div class="absolute -bottom-24 -right-24 size-72 rounded-full pointer-events-none bg-[var(--color-accent-300)] opacity-[0.22] blur-[70px]"></div>

        <div class="w-full max-w-[380px] relative">

            <a href="index.html" class="flex items-center justify-center gap-2.5 mb-8">
                <img src="assets/logo-dark-BsmosVB3.svg" alt="Dreams Core logo" class="login-logo">
            </a>

            <div class="surface-card p-7 shadow-[var(--shadow-lg)] text-center">
                <img src="assets/avatar-18-DlXc3rwt.jpg" class="size-16 rounded-full object-cover mx-auto ring-4 ring-[var(--surface-sunken)]" alt="Amelia Hart profile photo">
                <h1 class="font-display font-bold text-[17px] mt-3">Amelia Hart</h1>
                <p class="text-[12px] text-tertiary">amelia.hart@dreamsadmin.com</p>

                <form class="space-y-4 mt-5 text-start">
                    <div>
                        <label class="text-[11.5px] font-semibold uppercase tracking-wide mb-1.5 text-tertiary">Enter password to unlock</label>
                        <div class="relative mt-1.5">
                            <i class="icon-lock absolute top-1/2 -translate-y-1/2 start-3 text-[14px] text-tertiary"></i>
                            <input type="password" placeholder="••••••••" class="w-full ps-9 pe-9 py-2.5 rounded-lg text-[12.5px] outline-none bg-sunken-bordered" autocomplete="current-password">
                            <button type="button" class="absolute top-1/2 -translate-y-1/2 end-3 text-tertiary" aria-label="View"><i class="icon-eye text-[14px]"></i></button>
                        </div>
                    </div>
                    <a href="index.html" class="btn btn-primary w-full justify-center !text-[13px]"><i class="icon-lock-open text-[13px]"></i>Unlock</a>
                </form>

                <a href="login.html" class="flex items-center justify-center gap-1.5 text-[12.5px] font-semibold mt-6 text-secondary"><i class="icon-log-out text-[13px]"></i>Sign in as a different user</a>
            </div>

        </div>

    </div>
<!-- ApexCharts  -->
<script src="assets/libs/apexcharts/apexcharts.min.js"></script>
<!-- Wizard JS -->
<!-- Flatpickr JS -->
<script src="assets/libs/flatpickr/flatpickr.min.js"></script>

</body></html>
