    <meta charset="utf-8">
<title>Reset Password | Dreams Core - Tailwind Admin Template</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta content="Dreams Core is a modern, feature-rich Tailwind CSS admin dashboard template with a wide range of ready-to-use pages, components, and layouts for building web applications." name="description">

<link rel="shortcut icon" type="image/x-icon" href="assets/favicon-BfZIYWJw.png">

  <link rel="stylesheet" crossorigin="" href="assets/script-DbEScXyL.css">
</head>

<body>

    <div class="min-h-screen flex items-center justify-center p-6 bg-sunken relative overflow-hidden">

        <div class="absolute -top-24 -left-24 size-72 rounded-full pointer-events-none bg-[var(--color-primary-300)] opacity-[0.25] blur-[70px]"></div>
        <div class="absolute -bottom-24 -right-24 size-72 rounded-full pointer-events-none bg-[var(--color-accent-300)] opacity-[0.22] blur-[70px]"></div>

        <div class="w-full max-w-[420px] relative">

            <a href="index.html" class="flex items-center justify-center gap-2.5 mb-8">
                <img src="assets/logo-dark-BsmosVB3.svg" alt="Dreams Core logo" class="login-logo">
            </a>

            <div class="surface-card p-7 shadow-[var(--shadow-lg)]">
                <span class="icon-chip is-primary size-11"><i class="icon-lock-keyhole text-[18px]"></i></span>
                <h1 class="font-display font-bold text-[19px] mt-4">Set a new password</h1>
                <p class="text-[12.5px] mt-1.5 text-tertiary">Your new password must be different from previously used passwords.</p>

                <form class="space-y-4 mt-5">
                    <div>
                        <label class="text-[11.5px] font-semibold uppercase tracking-wide mb-1.5 text-tertiary">New password</label>
                        <div class="relative mt-1.5">
                            <i class="icon-lock absolute top-1/2 -translate-y-1/2 start-3 text-[14px] text-tertiary"></i>
                            <input type="password" placeholder="••••••••" class="w-full ps-9 pe-9 py-2.5 rounded-lg text-[12.5px] outline-none bg-sunken-bordered" autocomplete="current-password">
                            <button type="button" class="absolute top-1/2 -translate-y-1/2 end-3 text-tertiary" aria-label="View"><i class="icon-eye text-[14px]"></i></button>
                        </div>
                    </div>
                    <div>
                        <label class="text-[11.5px] font-semibold uppercase tracking-wide mb-1.5 text-tertiary">Confirm new password</label>
                        <div class="relative mt-1.5">
                            <i class="icon-lock absolute top-1/2 -translate-y-1/2 start-3 text-[14px] text-tertiary"></i>
                            <input type="password" placeholder="••••••••" class="w-full ps-9 pe-9 py-2.5 rounded-lg text-[12.5px] outline-none bg-sunken-bordered" autocomplete="current-password">
                            <button type="button" class="absolute top-1/2 -translate-y-1/2 end-3 text-tertiary" aria-label="View"><i class="icon-eye text-[14px]"></i></button>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <p class="flex items-center gap-1.5 text-[11.5px] text-[var(--color-success-600)]"><i class="icon-check text-[11px]"></i>At least 8 characters</p>
                        <p class="flex items-center gap-1.5 text-[11.5px] text-tertiary"><i class="icon-circle text-[6px]"></i>One uppercase letter &amp; one number</p>
                        <p class="flex items-center gap-1.5 text-[11.5px] text-tertiary"><i class="icon-circle text-[6px]"></i>One special character</p>
                    </div>

                    <a href="login.html" class="btn btn-primary w-full justify-center !text-[13px]">Reset Password<i class="icon-arrow-right text-[13px]"></i></a>
                </form>

                <a href="login.html" class="flex items-center justify-center gap-1.5 text-[12.5px] font-semibold mt-6 text-secondary"><i class="icon-arrow-left text-[13px]"></i>Back to sign in</a>
            </div>

            <p class="text-center text-[11.5px] mt-5 text-tertiary">Still stuck? <a href="reset-password.html" class="font-semibold text-[var(--color-primary-600)]">Contact support</a></p>

        </div>

    </div>
<!-- ApexCharts  -->
<script src="assets/libs/apexcharts/apexcharts.min.js"></script>
