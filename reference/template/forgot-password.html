<!doctype html><html lang="en"><head>

    <meta charset="utf-8">
<title>Forgot Password | Dreams Core - Tailwind Admin Template</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta content="Dreams Core is a modern, feature-rich Tailwind CSS admin dashboard template with a wide range of ready-to-use pages, components, and layouts for building web applications." name="description">
<meta content="Dreams Technologies" name="author">

    <!-- Favicon -->
<link rel="shortcut icon" type="image/x-icon" href="assets/favicon-BfZIYWJw.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-z_cRtcRT.png">















  <script type="module" crossorigin="" src="assets/script-CFI7pXVP.js"></script>
  <link rel="stylesheet" crossorigin="" href="assets/script-DbEScXyL.css">
</head>

<body>

    <div class="min-h-screen flex items-center justify-center p-6 bg-sunken relative overflow-hidden">

        <div class="absolute -top-24 -left-24 size-72 rounded-full pointer-events-none bg-[var(--color-primary-300)] opacity-[0.25] blur-[70px]"></div>
        <div class="absolute -bottom-24 -right-24 size-72 rounded-full pointer-events-none bg-[var(--color-accent-300)] opacity-[0.22] blur-[70px]"></div>

        <div class="w-full max-w-[420px] relative">

            <a href="index.html" class="flex items-center justify-center gap-2.5 mb-8">
                <img src="assets/logo-dark-BsmosVB3.svg" alt="Dreams Core logo" class="login-logo">
            </a>

            <div class="surface-card p-7 shadow-[var(--shadow-lg)]">
                <span class="icon-chip is-primary size-11"><i class="icon-key-round text-[18px]"></i></span>
                <h1 class="font-display font-bold text-[19px] mt-4">Forgot your password?</h1>
                <p class="text-[12.5px] mt-1.5 text-tertiary">No worries, enter your email and we'll send you a reset link.</p>

                <form class="space-y-4 mt-5">
                    <div>
                        <label class="text-[11.5px] font-semibold uppercase tracking-wide mb-1.5 text-tertiary">Email address</label>
                        <div class="relative mt-1.5">
                            <i class="icon-mail absolute top-1/2 -translate-y-1/2 start-3 text-[14px] text-tertiary"></i>
                            <input type="email" placeholder="you@company.com" class="w-full ps-9 pe-3 py-2.5 rounded-lg text-[12.5px] outline-none bg-sunken-bordered">
                        </div>
                    </div>
                    <a href="verify-otp.html" class="btn btn-primary w-full justify-center !text-[13px]">Send Reset Link<i class="icon-arrow-right text-[13px]"></i></a>
                </form>

                <div class="flex items-start gap-2 p-3 rounded-lg mt-5 bg-[var(--surface-sunken)]">
                    <i class="icon-shield-check text-[13px] mt-0.5 shrink-0 text-[var(--color-success-600)]"></i>
                    <p class="text-[11px] text-[var(--text-tertiary)]">For your security, reset links expire after 15 minutes and can only be used once.</p>
                </div>

                <a href="login.html" class="flex items-center justify-center gap-1.5 text-[12.5px] font-semibold mt-6 text-secondary"><i class="icon-arrow-left text-[13px]"></i>Back to sign in</a>
            </div>

            <p class="text-center text-[11.5px] mt-5 text-tertiary">Still stuck? <a href="forgot-password.html" class="font-semibold text-[var(--color-primary-600)]">Contact support</a></p>

        </div>

    </div>
<!-- ApexCharts  -->
<script src="assets/libs/apexcharts/apexcharts.min.js"></script>

<!-- Flatpickr JS -->

<script src="assets/libs/choices.js/public/assets/scripts/choices.min.js"></script>

</body></html>
