services:
  postgres:
    image: postgres:18-alpine
    container_name: eds_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "6969:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-network

  redis:
    image: redis:8.6-alpine
    container_name: eds_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:

networks:
  app-network:
    driver: bridge