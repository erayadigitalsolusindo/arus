<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutorial ARUS</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16202e;--mute:#667085;--line:#e4e7ec;--acc:#1d4ed8;--accbg:#eaf0ff;--red:#e11d48}
@media (prefers-color-scheme:dark){:root{--bg:#0e141d;--panel:#151d29;--ink:#e6ebf2;--mute:#8d99ab;--line:#26303f;--acc:#7aa2ff;--accbg:#1b2a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:0 0 12px}
nav input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:12px}
nav h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 4px}
nav details{margin:1px 0}nav summary{cursor:pointer;padding:6px 9px;border-radius:7px;font-weight:600;font-size:14px;list-style:none}
nav summary::before{content:"▸";display:inline-block;width:14px;color:var(--mute)}nav details[open]>summary::before{content:"▾"}
nav summary:hover{background:var(--bg)}
nav a{display:block;padding:5px 9px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover{background:var(--bg)}nav a.on{background:var(--accbg);color:var(--acc);font-weight:600}
nav .sub{margin-left:14px}nav .lvl2{margin-left:28px}
nav a.g::before{content:"①";color:var(--red);margin-right:6px;font-size:13px}
main{padding:28px;max-width:1100px;width:100%}
.crumb{color:var(--mute);font-size:13px}
h2.t{font-size:26px;margin:4px 0 6px}
.path{font:12px ui-monospace,Consolas,monospace;color:var(--mute)}
.tabs{display:flex;gap:6px;margin:18px 0 12px}
.tabs button{padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.shot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.shot img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.shot.m img{max-width:340px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px}
.card h3{margin:0 0 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.step{display:flex;gap:10px;margin:8px 0;align-items:flex-start}.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;text-align:center;line-height:26px;font-size:14px}
.pn{display:flex;justify-content:space-between;margin-top:22px}
.pn a{color:var(--acc);text-decoration:none;cursor:pointer}
.rel a{color:var(--acc);text-decoration:none;display:block;margin:2px 0}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;max-height:45vh}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<nav><h1>Tutorial ARUS</h1><input id="q" placeholder="Cari halaman atau panduan…" aria-label="Cari"><div id="menu"></div></nav>
<main id="view"></main>
</div>

const GUIDES=[{"id":"tambah-barang","title":"Cara menambah barang","intro":"Barang adalah dasar semua transaksi: kasir, pembelian, dan stok memakai data ini. Ikuti langkah berikut untuk menambah barang baru.","shots":[{"title":"Buka daftar barang","file":"guides/desktop/tambah-barang/01.webp","steps":["Klik tombol Tambah untuk membuka formulir barang baru."]},{"title":"Isi data barang","file":"guides/desktop/tambah-barang/02.webp","steps":["Nama barang: tulis nama yang mudah dikenali kasir.","Barcode (opsional): isi atau pindai agar barang cepat ditemukan di kasir.","Satuan: pilih satuan jual, misalnya pcs atau botol.","Harga beli (modal) per satuan.","Harga jual per satuan.","Kategori (opsional): memudahkan pengelompokan dan laporan.","Klik Simpan untuk menyimpan barang."],"tip":"SKU dibuat otomatis bila dikosongkan."},{"title":"Barang tersimpan","file":"guides/desktop/tambah-barang/03.webp","steps":[]}],"at":"/items"},{"id":"tambah-member","title":"Cara menambah member (pelanggan)","intro":"Member dipakai untuk poin, kupon, harga khusus, dan penjualan kredit (piutang). Pelanggan umum tidak perlu didaftarkan.","shots":[{"title":"Buka formulir member baru","file":"guides/desktop/tambah-member/01.webp","steps":["Klik tombol Tambah untuk membuka formulir member baru."]},{"title":"Isi data member","file":"guides/desktop/tambah-member/02.webp","steps":["Nama member (wajib).","Nomor telepon: dipakai untuk mencari member di kasir.","Alamat (opsional): kota, kecamatan, dan alamat lengkap.","Klik Simpan untuk menyimpan member."]},{"title":"Member tersimpan","file":"guides/desktop/tambah-member/03.webp","steps":[]}],"at":"/members"},{"id":"faktur-pembelian","title":"Cara mencatat faktur pembelian dari pemasok","intro":"Faktur pembelian menambah stok dan menghitung ulang harga pokok rata-rata barang. Hutang ke pemasok tercatat bila dipilih Kredit.","shots":[{"title":"Isi data faktur dan tambah barang","file":"guides/desktop/faktur-pembelian/01.webp","steps":["Pilih pemasok.","Isi nomor faktur dari pemasok (sesuai kertas faktur).","Pilih Tunai atau Kredit. Kredit akan membuat hutang ke pemasok.","Cari/pindai barang yang dibeli lalu tekan Enter; barang masuk ke tabel di bawahnya.","Jumlah yang ditambahkan setiap kali Enter ditekan.","Klik Simpan pembelian setelah semua barang dan jumlahnya benar."],"tip":"Isi jumlah beli dan harga beli pada tabel; diskon bertingkat bisa diisi per baris."}],"at":"/purchases/new"},{"id":"tambah-pemasok","title":"Cara menambah pemasok (suplier)","intro":"Pemasok dipakai pada faktur pembelian dan pencatatan hutang.","shots":[{"title":"Buka daftar pemasok","file":"guides/desktop/tambah-pemasok/01.webp","steps":["Klik Tambah Suplier."]},{"title":"Isi data pemasok","file":"guides/desktop/tambah-pemasok/02.webp","steps":["Nama pemasok (wajib).","Kode (opsional): kosongkan agar dibuat otomatis.","Nama orang yang dihubungi di pemasok.","Nomor telepon pemasok.","Klik Simpan."]}],"at":"/suppliers"},{"id":"retur-penjualan","title":"Cara membuat retur penjualan","intro":"Retur dibuat dari nota penjualan yang sudah ada: barang kembali ke stok dan uang/piutang disesuaikan.","shots":[{"title":"Pilih nota yang diretur","file":"guides/desktop/retur-penjualan/01.webp","steps":["Cari nota dengan nomor nota, nama member, atau kasir.","Klik nota yang barangnya dikembalikan."]},{"title":"Isi jumlah barang yang diretur","file":"guides/desktop/retur-penjualan/02.webp","steps":["Salah pilih nota? Klik Ganti nota.","Isi jumlah barang yang dikembalikan (tidak boleh melebihi yang dibeli).","Atau klik Isi semua sisa untuk meretur seluruh barang.","Tulis alasan retur dan kondisi barang.","Klik Simpan Retur."]}],"at":"/sales-returns"},{"id":"saldo-awal-stok","title":"Cara mengisi saldo awal stok","intro":"Dipakai saat toko baru mulai memakai ARUS: isi jumlah stok yang ada di setiap tempat. Setelah dikunci, perubahan stok hanya lewat transaksi.","shots":[{"title":"Isi stok awal per barang","file":"guides/desktop/saldo-awal-stok/01.webp","steps":["Cari barang dengan nama, kode, atau barcode.","Isi jumlah di rak display (etalase).","Isi jumlah di gudang.","Isi jumlah barang retur/rusak bila ada.","Setelah semua terisi, klik Kunci & mulai operasional."],"tip":"Kunci hanya sekali per cabang. Periksa angkanya sebelum menekan tombol ini."}],"at":"/stock-opening"},{"id":"stok-opname","title":"Cara melakukan stok opname","intro":"Opname mencocokkan stok di sistem dengan hasil hitung fisik; selisihnya dicatat sebagai penyesuaian.","shots":[{"title":"Mulai sesi opname","file":"guides/desktop/stok-opname/01.webp","steps":["Opname baru: hitung dalam sesi (bisa dikerjakan beberapa orang, lalu disahkan).","Opname langsung: hitung dan koreksi stok saat itu juga."]},{"title":"Tentukan sesi","file":"guides/desktop/stok-opname/02.webp","steps":["Pilih tempat yang dihitung: Display, Gudang, atau Retur.","Catatan sesi (opsional).","Klik Buat sesi, lalu isi hasil hitung tiap barang."]}],"at":"/stock-opname"},{"id":"shift-kasir","title":"Memantau dan menutup shift kasir","intro":"Shift mencatat uang laci kasir dari buka sampai tutup. Selisih uang tercatat untuk pemeriksaan.","shots":[{"title":"Daftar shift","file":"guides/desktop/shift-kasir/01.webp","steps":["Pilih rentang tanggal shift.","Saring menurut kasir.","Tampilkan hanya shift yang uangnya selisih.","Shift yang masih terbuka bisa ditutup di sini: hitung uang laci lalu konfirmasi."],"tip":"Shift dibuka dari layar Kasir saat kasir mulai bekerja."}],"at":"/shifts"},{"id":"kas-kecil","title":"Mencatat kas kecil (uang masuk/keluar laci)","intro":"Catat pengeluaran kecil seperti beli galon atau parkir agar uang laci tetap cocok.","shots":[{"title":"Buka catatan kas kecil","file":"guides/desktop/kas-kecil/01.webp","steps":["Klik Catat kas kecil."]},{"title":"Isi catatan","file":"guides/desktop/kas-kecil/02.webp","steps":["Pilih Kas keluar atau Kas masuk.","Pilih kategori.","Isi jumlah uang.","Klik Simpan."]}],"at":"/petty-cash"},{"id":"pelunasan-piutang","title":"Menerima pelunasan piutang member","intro":"Piutang muncul dari penjualan kredit. Terima pembayaran per nota atau sekaligus per member.","shots":[{"title":"Daftar piutang","file":"guides/desktop/pelunasan-piutang/01.webp","steps":["Cari nota atau member.","Saring: belum lunas, lunas, atau semua.","Catat piutang lama yang dibawa dari sebelum memakai ARUS.","Terima pembayaran sekaligus untuk satu member."]},{"title":"Pilih member yang membayar","file":"guides/desktop/pelunasan-piutang/02.webp","steps":["Cari dan pilih member; lalu isi jumlah bayar dan simpan. Pembayaran melunasi nota paling lama lebih dulu."]}],"at":"/receivables"},{"id":"pelunasan-hutang","title":"Membayar hutang ke pemasok","intro":"Hutang muncul dari faktur pembelian kredit. Bayar per faktur atau sekaligus per pemasok.","shots":[{"title":"Daftar hutang","file":"guides/desktop/pelunasan-hutang/01.webp","steps":["Cari nota, nomor faktur, atau pemasok.","Saring status pelunasan.","Bayar hutang sekaligus untuk satu pemasok."]}],"at":"/supplier-payables"},{"id":"laporan-penjualan","title":"Melihat laporan penjualan","intro":"Laporan penjualan per faktur memperlihatkan semua nota pada periode tertentu, bisa disaring dan diekspor.","shots":[{"title":"Atur periode dan saringan","file":"guides/desktop/laporan-penjualan/01.webp","steps":["Pilih rentang tanggal.","Atau pakai pintasan periode: hari ini, 7 hari, 30 hari, bulan ini.","Saring menurut kasir atau cabang.","Cari nomor faktur tertentu.","Ekspor ke Excel atau PDF untuk dicetak/dikirim."]}],"at":"/reports/sales/invoices"},{"id":"tambah-pengguna","title":"Menambah pengguna (kasir/staf)","intro":"Setiap staf punya akun sendiri dengan role yang menentukan menu apa yang boleh dibuka.","shots":[{"title":"Buka form pengguna","file":"guides/desktop/tambah-pengguna/01.webp","steps":["Klik Tambah Pengguna."]},{"title":"Isi data pengguna","file":"guides/desktop/tambah-pengguna/02.webp","steps":["Nama lengkap staf.","Email: dipakai untuk masuk ke ARUS.","Pilih role: menentukan hak akses staf.","Kata sandi awal; staf bisa menggantinya setelah masuk.","Klik Simpan."],"tip":"Paket langganan membatasi jumlah pengguna aktif."}],"at":"/users"},{"id":"tambah-role","title":"Membuat role dan hak akses","intro":"Role mengatur menu dan aksi (lihat, tambah, ubah, hapus) yang boleh dilakukan pengguna.","shots":[{"title":"Buka form role","file":"guides/desktop/tambah-role/01.webp","steps":["Klik Tambah Role."]},{"title":"Tentukan hak akses","file":"guides/desktop/tambah-role/02.webp","steps":["Beri nama role, misalnya Kasir atau Admin Gudang.","Centang semua hak sekaligus, atau pilih satu per satu di tiap modul.","Centang Lihat agar menu tampil; Tambah/Ubah/Hapus untuk aksinya.","Klik Simpan."]}],"at":"/roles"},{"id":"masuk","title":"Cara masuk (login)","intro":"Masuk ke ARUS memakai email dan kata sandi yang didaftarkan. Setelah berhasil Anda diarahkan ke Dashboard.","shots":[{"title":"Isi email dan kata sandi","file":"guides/desktop/masuk/01.webp","steps":["Isi alamat email akun Anda.","Isi kata sandi. Ikon mata di ujung kolom untuk menampilkan atau menyembunyikan sandi.","Centang \"Tetap masuk\" agar tidak perlu login ulang di perangkat ini.","Klik Masuk. Anda akan diarahkan ke Dashboard."]},{"title":"Lupa sandi atau belum punya akun","file":"guides/desktop/masuk/02.webp","steps":["Lupa kata sandi? Klik di sini untuk mengatur ulang lewat email.","Belum punya akun? Klik Buat akun."]}],"at":"/login"},{"id":"daftar","title":"Cara mendaftar akun baru","intro":"Satu pendaftaran membuat akun pemilik dan outlet pertama sekaligus. Setelah itu Anda langsung masuk ke Dashboard.","shots":[{"title":"Isi data bisnis dan pemilik","file":"guides/desktop/daftar/01.webp","steps":["Nama bisnis Anda.","Nama outlet pertama, misalnya Cabang Pusat.","Nama pemilik.","Email: dipakai untuk masuk.","Nomor HP aktif.","Kata sandi minimal 10 karakter, huruf dan angka. Indikator di bawahnya menunjukkan kekuatan sandi.","Ulangi kata sandi yang sama.","Centang persetujuan Syarat Layanan dan Kebijakan Privasi.","Klik Buat akun."],"tip":"Contoh ini hanya diisi, tidak dikirim. Email yang sudah terdaftar akan ditolak."}],"at":"/login"},{"id":"cari-barang","title":"Mencari dan memfilter daftar item","intro":"Daftar Item menampilkan semua barang beserta harga dan stok. Gunakan pencarian dan filter untuk menemukan barang dengan cepat.","shots":[{"title":"Cari dan filter","file":"guides/desktop/cari-barang/01.webp","steps":["Cari berdasarkan nama, kode, atau barcode.","Filter status: Semua, Aktif, atau Nonaktif.","Tabel menampilkan kode, nama, harga jual, stok, satuan, kategori, dan status.","Tambah Item untuk membuat barang baru."]}],"at":"/items"},{"id":"ubah-barang","title":"Mengubah data barang","intro":"Ubah nama, harga, atau pengaturan barang kapan saja. Perubahan harga jual tercatat di Riwayat Harga dan tidak mengubah nota lama.","shots":[{"title":"Pilih barang","file":"guides/desktop/ubah-barang/01.webp","steps":["Klik ikon pensil pada barang yang ingin diubah."]},{"title":"Ubah lalu simpan","file":"guides/desktop/ubah-barang/02.webp","steps":["Ubah nama barang.","Ubah harga jual satuan.","Klik Simpan. Muncul notifikasi \"Item disimpan.\""],"tip":"Contoh ini hanya membuka form, tidak menyimpan perubahan."}],"at":"/items"},{"id":"nonaktifkan-barang","title":"Menonaktifkan dan mengaktifkan kembali barang","intro":"ARUS tidak menghapus barang permanen supaya riwayat nota dan stok tetap utuh. Barang yang tidak dijual lagi cukup dinonaktifkan.","shots":[{"title":"Nonaktifkan barang","file":"guides/desktop/nonaktifkan-barang/01.webp","steps":["Klik ikon arsip untuk menonaktifkan barang. Barang disembunyikan dari pilihan dan tidak bisa dijual."]},{"title":"Aktifkan kembali","file":"guides/desktop/nonaktifkan-barang/02.webp","steps":["Ubah filter status menjadi Nonaktif untuk melihat barang yang diarsipkan."],"tip":"Pada barang nonaktif, klik ikon putar balik di kolom aksi untuk mengaktifkannya kembali."}],"at":"/items"},{"id":"kasir-layar","title":"Kasir: Mengenal layar Kasir","intro":"Layar Kasir (tampilan biasa) dibagi tiga kolom: informasi outlet di kiri, daftar barang di tengah, dan keranjang di kanan. Semua pekerjaan kasir bisa dilakukan dari satu layar ini.","shots":[{"title":"Bilah atas","file":"guides/desktop/kasir-layar/01.webp","steps":["Panah kembali: keluar dari Kasir ke Dashboard. Kasir yang hanya boleh memakai layar ini melihat tombol Keluar (logout) di tempat yang sama.","Daftar tombol pintas (shortcut) keyboard. Bisa juga dibuka dengan tombol F1.","Ganti bahasa tampilan.","Layar penuh: menyembunyikan bilah browser agar area kerja lebih luas.","Ganti tema terang/gelap. Pilih yang paling nyaman di mata Anda.","Nama kasir yang sedang masuk. Nota yang Anda simpan tercatat atas nama ini."]},{"title":"Panel informasi outlet (kolom kiri)","file":"guides/desktop/kasir-layar/02.webp","steps":["Panel ini awalnya tertutup. Klik panah ini untuk membuka atau menutupnya; pilihan Anda diingat.","Nomor nota baru, jam, nama kasir, dan nomor shift yang sedang berjalan.","Salesman nota: klik untuk memilih. Kosongkan untuk \"Salesman Umum\".","Daftar nota yang diparkir sementara.","Tutup shift saat selesai bekerja (hitung uang laci).","Lihat semua nota yang tersimpan hari ini.","Pindah ke tampilan Classic (bergaya aplikasi desktop). Pilihan diingat untuk login berikutnya.","Catat uang keluar/masuk laci di luar penjualan."],"tip":"Bila toko Anda punya lebih dari satu outlet, pilihan outlet ada di bagian atas panel ini. Pindah outlet butuh PIN Owner/Supervisor dan mengosongkan keranjang."},{"title":"Kolom tengah dan kanan","file":"guides/desktop/kasir-layar/03.webp","steps":["QTY: jumlah untuk barang berikutnya (kosong = 1).","Kolom cari / pindai barcode barang.","Kartu barang: foto, nama, kode, stok, dan harga. Stok merah berarti habis.","Barang cepat: 16 tombol barang yang paling sering dijual.","Keterangan nota (opsional).","Total belanja yang harus dibayar pelanggan, selalu tampil besar.","Tombol BAYAR. Menyala hijau setelah ada barang di keranjang."]},{"title":"Di HP atau tablet kecil","file":"guides/desktop/kasir-layar/04.webp","steps":["Main: informasi outlet.","Barang: cari dan pilih barang.","Keranjang: periksa belanjaan lalu bayar."],"tip":"Pada layar sempit, tiga kolom berubah menjadi tiga tab di bawah layar."}],"at":"/kasir"},{"id":"kasir-buka-shift","title":"Kasir: Membuka shift (modal awal laci)","intro":"Sebelum menyimpan nota pertama, kasir harus membuka shift: catat uang kembalian yang ada di laci. Semua nota dan uang yang diterima sampai Tutup Shift tercatat ke shift ini.","shots":[{"title":"Isi modal awal","file":"guides/desktop/kasir-buka-shift/01.webp","steps":["Hitung uang di laci lalu isi jumlahnya sebagai modal awal.","Nanti: tutup dialog dulu. Anda tetap bisa memilih barang, tetapi belum bisa menyimpan nota.","Klik Buka Shift. Dialog ini juga muncul otomatis saat Anda menekan BAYAR tanpa shift."]},{"title":"Shift yang sedang berjalan","file":"guides/desktop/kasir-buka-shift/02.webp","steps":["Setelah shift dibuka, nomor shift tampil di panel informasi.","Tombol Tutup Shift muncul di sini; lihat panduan Tutup Shift."],"tip":"Satu kasir hanya punya satu shift terbuka per outlet. Bila lupa menutup, shift berikutnya tidak bisa dibuka sampai shift lama ditutup."}],"at":"/kasir"},{"id":"kasir-cari-barang","title":"Kasir: Mencari dan menambah barang","intro":"Barang bisa dimasukkan ke keranjang dengan memindai barcode, mengetik kode/nama, mengklik kartu barang, atau memakai tombol Barang cepat.","shots":[{"title":"Kolom pencarian dan QTY","file":"guides/desktop/kasir-cari-barang/01.webp","steps":["QTY (F3): isi jumlah lebih dulu bila membeli lebih dari satu, mis. 3. Kosong berarti 1.","Cari barang (F2): ketik kode atau nama, atau pindai barcode dengan scanner. Hasil menyaring otomatis.","Lihat isi keranjang sebagai tabel lengkap.","Muat ulang daftar barang dan stok terbaru.","Menaruh kursor di kolom cari agar siap memindai."]},{"title":"Memindai atau mengetik kode barang","file":"guides/desktop/kasir-cari-barang/02.webp","steps":["Jumlah 3 sudah diisi.","Kode barang diketik atau dipindai, lalu tekan Enter. Barang cocok langsung masuk keranjang sebanyak QTY.","Daftar di bawah menyaring sesuai ketikan Anda."],"tip":"Bila satu barcode dipakai beberapa barang, muncul daftar pilihan; klik barang yang benar."},{"title":"Barang masuk keranjang","file":"guides/desktop/kasir-cari-barang/03.webp","steps":["Barang yang baru ditambahkan selalu naik ke baris paling atas dan diberi sorotan sebentar.","Jumlah 3 sesuai QTY tadi. Memindai barang yang sama lagi menambah jumlahnya, bukan baris baru.","Total langsung dihitung oleh sistem."]},{"title":"Menambah dengan klik kartu barang","file":"guides/desktop/kasir-cari-barang/04.webp","steps":["Klik Tambah Keranjang di kartu barang mana pun untuk memasukkannya (jumlah 1)."],"tip":"Gulir daftar ke bawah lalu klik Muat lebih banyak untuk melihat barang lainnya."},{"title":"Barang cepat (tanpa pindai)","file":"guides/desktop/kasir-cari-barang/05.webp","steps":["Satu slot = satu barang favorit. Klik slot terisi untuk langsung memasukkan barangnya ke keranjang.","Klik kanan (atau tekan lama di layar sentuh) pada slot terisi untuk mengganti atau mengosongkan. Klik slot kosong (+) untuk mengisinya."],"tip":"Cocok untuk barang tanpa barcode, mis. gorengan atau plastik. Slot tersimpan per kasir."},{"title":"Mengisi slot Barang cepat","file":"guides/desktop/kasir-cari-barang/06.webp","steps":["Cari barang yang akan ditaruh di slot ini.","Klik barangnya: tersimpan di slot sampai Anda menggantinya."]},{"title":"Melihat keranjang sebagai tabel","file":"guides/desktop/kasir-cari-barang/07.webp","steps":["Cari barang di dalam keranjang.","Nomor, nama, kode, jumlah, harga, potongan, dan jumlah per baris.","Ringkasan: subtotal, potongan, biaya lain, pajak, lalu total."],"tip":"Tabel ini hanya untuk dilihat. Mengubah jumlah dilakukan di keranjang."}],"at":"/kasir"},{"id":"kasir-keranjang","title":"Kasir: Mengatur keranjang belanja","intro":"Ubah jumlah, ubah harga atau beri potongan, hapus barang, atau kosongkan keranjang. Stok dan harga diperiksa sistem setiap ada perubahan.","shots":[{"title":"Tombol di setiap baris","file":"guides/desktop/kasir-keranjang/01.webp","steps":["Kurangi jumlah 1 (shortcut Ctrl dan −).","Atau ketik jumlah langsung, boleh desimal untuk barang timbang (mis. 0,5). Enter pindah ke baris berikutnya.","Tambah jumlah 1 (Ctrl dan +).","Ubah harga atau beri potongan (Ctrl+E). Butuh persetujuan.","Hapus barang ini dari keranjang (Ctrl+Delete).","Sub total dan potongan baris ini."]},{"title":"Bila stok tidak cukup","file":"guides/desktop/kasir-keranjang/02.webp","steps":["Baris memerah dan muncul pesan stok. Jumlah melebihi stok tidak bisa dibayar.","Kecilkan jumlahnya sesuai stok tersedia.","Tombol BAYAR nonaktif selama ada baris bermasalah."]},{"title":"Ubah harga atau beri potongan","file":"guides/desktop/kasir-keranjang/03.webp","steps":["Tab Ubah harga: ganti harga satuan barang ini hanya untuk nota ini.","Tab Potongan: beri potongan dalam rupiah per satuan atau untuk seluruh baris.","Perubahan butuh persetujuan: pilih Owner/Supervisor lalu masukkan PIN 6 digit miliknya.","Klik Setujui & Terapkan. Baris diberi tanda \"Harga diubah\" beserta nama penyetujunya."],"tip":"Tanda \"Kembalikan harga normal\" atau \"Hapus potongan\" muncul di baris untuk membatalkan perubahan."},{"title":"Hapus barang atau kosongkan keranjang","file":"guides/desktop/kasir-keranjang/04.webp","steps":["Hapus satu barang.","Kosongkan seluruh keranjang sekaligus (pelanggan batal belanja)."],"tip":"Keranjang tersimpan di browser per kasir. Jika browser tertutup tidak sengaja, isinya dipulihkan saat Kasir dibuka lagi (harga yang diubah kembali normal)."}],"at":"/kasir"},{"id":"kasir-member-kupon","title":"Kasir: Member, tukar poin, kupon, dan salesman","intro":"Pilih member agar poin terkumpul, tukarkan poin sebagai potongan, pakai kupon belanja, dan catat salesman penjual.","shots":[{"title":"Memilih member","file":"guides/desktop/kasir-member-kupon/01.webp","steps":["Cari member dengan nama, kode, atau nomor telepon (F4 membuka dialog ini).","Klik member yang dimaksud. Tampil poin dan levelnya."],"tip":"Tanpa memilih member, nota dicatat sebagai \"Member Umum\". Penjualan kredit (piutang) wajib memilih member."},{"title":"Member terpilih","file":"guides/desktop/kasir-member-kupon/02.webp","steps":["Foto member. Klik untuk mengganti atau melepas member.","Nama, kode, level, saldo poin, dan poin yang akan didapat dari nota ini.","Ikon hadiah: tukar poin menjadi potongan.","Ikon tiket: pakai kupon belanja."]},{"title":"Menukar poin","file":"guides/desktop/kasir-member-kupon/03.webp","steps":["Isi jumlah poin yang ditukar. Nilai 1 poin dan batas maksimal ditampilkan di atasnya.","Maks.: tukar poin sebanyak mungkin yang diizinkan.","Klik Selesai. Potongan langsung mengurangi total."],"tip":"Level member tertentu mungkin tidak boleh menukar poin; sistem akan memberi tahu."},{"title":"Memakai kupon belanja","file":"guides/desktop/kasir-member-kupon/04.webp","steps":["Ketik atau pindai kode kupon.","Klik Pakai. Sistem memeriksa kupon (masa berlaku, minimal belanja, dsb.).","Selesai. Potongan kupon dihitung sebelum pajak; boleh memakai lebih dari satu kupon."]},{"title":"Memilih salesman","file":"guides/desktop/kasir-member-kupon/05.webp","steps":["Pilih salesman penjual nota ini (F6). Kosongkan untuk \"Salesman Umum\".","Klik Selesai. Salesman dipakai untuk laporan dan komisi."]}],"at":"/kasir"},{"id":"kasir-biaya-pajak","title":"Kasir: Biaya lain-lain, pajak, dan keterangan","intro":"Tambahkan ongkos kirim atau biaya bungkus, hitung pajak bila toko memungut pajak, dan tulis keterangan nota.","shots":[{"title":"Isian di bawah keranjang","file":"guides/desktop/kasir-biaya-pajak/01.webp","steps":["Isi biaya tambahan sekali jalan (mis. 5.000). Biaya ikut menambah total.","Untuk lebih dari satu jenis biaya, klik tombol rincian.","Pajak Toko dan Pajak Negara (persennya tampil di bawah namanya). Baru dihitung setelah Anda menekan HITUNG PAJAK.","HITUNG PAJAK: terapkan pajak pada nota ini.","BATAL HITUNG: lepas pajak dari nota ini.","Keterangan nota, mis. nama penerima. Ikut tercetak di struk."]},{"title":"Setelah HITUNG PAJAK","file":"guides/desktop/kasir-biaya-pajak/02.webp","steps":["Nilai pajak muncul.","Total ikut bertambah."],"tip":"Pajak hanya muncul bila outlet memiliki persentase pajak di pengaturan outlet."},{"title":"Rincian biaya lain-lain","file":"guides/desktop/kasir-biaya-pajak/03.webp","steps":["Nama biaya, mis. Ongkos kirim.","Jumlah biayanya.","Tambah baris biaya lain (maksimal 20).","Klik Simpan rincian. Total semua biaya masuk ke kolom Biaya Lain-Lain."]}],"at":"/kasir"},{"id":"kasir-pending","title":"Kasir: Menyimpan nota pending","intro":"Pending memarkir belanjaan pelanggan yang belum selesai, supaya Anda bisa melayani pelanggan lain, lalu membukanya lagi kapan saja.","shots":[{"title":"Parkir keranjang","file":"guides/desktop/kasir-pending/01.webp","steps":["Klik PENDING (F7) saat pelanggan belum jadi membayar."]},{"title":"Beri keterangan","file":"guides/desktop/kasir-pending/02.webp","steps":["Tulis keterangan agar mudah dikenali, mis. nama pelanggan. Boleh dikosongkan.","Klik Simpan Pending (atau Enter). Keranjang langsung kosong dan siap untuk pelanggan berikutnya."]},{"title":"Membuka daftar nota pending","file":"guides/desktop/kasir-pending/03.webp","steps":["Ikon daftar (F8). Angka kuning = jumlah nota pending. Maksimal ada batasnya."]},{"title":"Membuka, mengganti nama, atau menghapus","file":"guides/desktop/kasir-pending/04.webp","steps":["Ubah keterangan kapan saja.","Buka: isi nota kembali ke keranjang. Bila keranjang sedang berisi, otomatis diparkir dulu.","Hapus nota pending (isinya hilang)."],"tip":"Harga dan stok dihitung ulang saat nota dibuka. Nota pending tersimpan di browser komputer kasir ini, jadi tidak muncul di komputer lain."}],"at":"/kasir"},{"id":"kasir-bayar","title":"Kasir: Membayar dan menyimpan transaksi","intro":"Pilih jenis transaksi (Tunai, Kredit, Nontunai, Split), isi uang diterima, lalu simpan. Stok berkurang dan struk tercetak otomatis.","shots":[{"title":"Klik BAYAR","file":"guides/desktop/kasir-bayar/01.webp","steps":["Periksa total sekali lagi bersama pelanggan.","Klik BAYAR (F10 atau Ctrl+Enter). Bila shift belum dibuka, Anda diminta membukanya dulu."]},{"title":"Pembayaran tunai (F1)","file":"guides/desktop/kasir-bayar/02.webp","steps":["Jenis transaksi: F1 TUNAI, F2 KREDIT, F3 NONTUNAI, F4 SPLITCASH. Tekan tombol F-nya untuk berpindah.","Isi uang yang diterima dari pelanggan.","Total yang sudah dibayar.","Kembalian dihitung otomatis. Bila uang kurang, tulisan berubah menjadi Kurang.","Batal: kembali ke keranjang tanpa menyimpan.","Simpan Transaksi (tombol End)."],"tip":"Enter di kolom isian memindahkan ke kolom berikutnya, terakhir ke tombol Simpan."},{"title":"Nontunai (F3): transfer, kartu, e-wallet, QRIS","file":"guides/desktop/kasir-bayar/03.webp","steps":["Pilih jenis (transfer, kartu debit/kredit, e-wallet, deposit member, QRIS).","Isi nomor referensi / ID transaksi dari struk EDC atau bukti transfer."],"tip":"Untuk QRIS, klik Buat QR QRIS lalu minta pelanggan memindai. Nota tersimpan otomatis setelah pembayaran diterima. Bila ada biaya metode yang ditanggung pelanggan, biaya itu ditagihkan terpisah."},{"title":"Split cash (F4): beberapa cara bayar","file":"guides/desktop/kasir-bayar/04.webp","steps":["Isi jumlah per metode, mis. sebagian tunai.","Tambah metode lain, mis. sisanya transfer."],"tip":"Jumlah semua metode harus menutup total belanja."},{"title":"Kredit (F2): jual ke member dengan piutang","file":"guides/desktop/kasir-bayar/05.webp","steps":["Kredit hanya untuk member. Tutup dialog, pilih member di panel pelanggan, lalu bayar lagi."],"tip":"Dengan member terpilih, dialog menampilkan jatuh tempo, limit piutang, dan piutang berjalan. Boleh membayar di muka (DP); sisanya menjadi piutang. Melewati limit butuh persetujuan Owner/Supervisor. Pelunasannya dicatat di menu Piutang."},{"title":"Transaksi berhasil","file":"guides/desktop/kasir-bayar/06.webp","steps":["Nomor nota yang tersimpan.","Ringkasan: total, uang diterima, dan kembalian (atau piutang untuk transaksi kredit).","Transaksi Baru: kosongkan layar untuk pelanggan berikutnya. Enter juga bisa.","Cetak struk (atau cetak ulang bila perlu).","Pengaturan struk di komputer ini: cetak otomatis, lebar kertas 58/80 mm, cara cetak, dan tes printer."],"tip":"Gambar ini memakai nomor nota contoh. Struk dicetak langsung ke printer lewat print-agent, atau lewat browser bila print-agent tidak aktif."}],"at":"/kasir"},{"id":"kasir-hari-ini-shift","title":"Kasir: Penjualan hari ini, kas kecil, dan tutup shift","intro":"Pantau nota hari ini, catat uang keluar/masuk laci, dan tutup shift di akhir hari.","shots":[{"title":"Penjualan hari ini (F9)","file":"guides/desktop/kasir-hari-ini-shift/01.webp","steps":["Cari nota dengan nomor transaksi.","Cetak rekap penjualan Anda (per metode, uang lain, isi laci) ke printer struk.","Lihat detail isi nota.","Cetak ulang struk (tercatat sebagai salinan)."],"tip":"Dialog ini juga menampilkan total per metode dan uang yang seharusnya ada di laci."},{"title":"Kas kecil","file":"guides/desktop/kasir-hari-ini-shift/02.webp","steps":["Pilih Kas keluar (uang keluar laci) atau Kas masuk (menambah uang laci).","Pilih kategori.","Jumlah uang.","Simpan. Kas keluar di atas batas tertentu butuh PIN Owner/Supervisor."],"tip":"Catatan kas kecil ikut dihitung saat Tutup Shift supaya uang laci cocok."},{"title":"Tutup shift","file":"guides/desktop/kasir-hari-ini-shift/03.webp","steps":["Isi hasil hitung fisik per metode: uang tunai di laci, dan jumlah menurut struk EDC / mutasi QRIS / transfer.","Bila yakin cocok, klik ini untuk mengisi sama dengan angka sistem.","Lihat dari mana angka \"Seharusnya\" berasal.","Tutup Shift. Bila ada selisih, wajib isi catatan dan minta persetujuan PIN."],"tip":"Setelah ditutup, Anda bisa mencetak struk tutup shift atau langsung membuka shift baru."}],"at":"/kasir"},{"id":"kasir-shortcut","title":"Kasir: Tombol pintas (shortcut) keyboard","intro":"Kasir berpengalaman bisa bekerja tanpa mouse. Tekan F1 kapan saja untuk melihat daftar ini.","shots":[{"title":"Daftar shortcut","file":"guides/desktop/kasir-shortcut/01.webp","steps":["Layar kasir: F2 cari, F3 QTY, F4 member, F6 salesman, Ctrl+K kupon, F7 pending, F8 daftar pending, F9 penjualan hari ini, F10 atau Ctrl+Enter bayar, Esc kosongkan pencarian.","Baris keranjang: Ctrl+↑/↓ pilih baris, Ctrl+ dan − ubah jumlah, Ctrl+E ubah harga, Ctrl+Delete hapus.","Dialog bayar: F1 Tunai, F2 Kredit, F3 Nontunai, F4 Split, End simpan transaksi."],"tip":"Shortcut tidak berlaku saat dialog terbuka; dialog punya tombolnya sendiri."}],"at":"/kasir"},{"id":"kasirb-layar","title":"Kasir Classic: Mengenal layar Kasir Classic","intro":"Tampilan Classic bergaya aplikasi desktop: isian nota di atas, tabel keranjang di tengah, dan tombol aksi di bagian bawah. Cocok untuk kasir yang terbiasa memakai keyboard.","shots":[{"title":"Kepala dan isian nota","file":"guides/desktop/kasirb-layar/01.webp","steps":["Nama toko, outlet, dan kode outlet.","Jam dan tanggal berjalan.","Ganti bahasa.","Ganti tema terang/gelap.","Pelanggan: klik (F4) untuk memilih member. Kosong = Member Umum.","Salesman nota (F6).","Nomor nota; baru terisi setelah nota disimpan."]},{"title":"Kode item, total, dan tabel keranjang","file":"guides/desktop/kasirb-layar/02.webp","steps":["QTY (F3): jumlah untuk barang berikutnya.","Kode item (F2): ketik, atau pindai barcode, lalu Enter.","Buka daftar barang hasil pencarian.","Barang cepat: 16 tombol barang favorit.","Pindah ke tampilan Kasir biasa.","Poin yang akan didapat member, jumlah baris barang, dan jumlah seluruh QTY.","Total belanja berukuran besar."]},{"title":"Bagian bawah layar","file":"guides/desktop/kasirb-layar/03.webp","steps":["Biaya lain-lain, pajak toko, dan pajak negara.","HITUNG PAJAK dan BATAL HITUNG.","Keterangan nota.","Simpan (Ctrl+S) untuk membayar.","Pending (F7).","Daftar nota pending (F8).","Penjualan hari ini (F9).","Segarkan daftar barang & stok (F5).","Kas kecil.","Tutup shift.","Keluar dari kasir."],"tip":"Bilah bawah selalu menempel di dasar layar sehingga tombol Simpan tidak perlu dicari."}],"at":"/kasirb"},{"id":"kasirb-buka-shift","title":"Kasir Classic: Membuka shift (saldo awal kasir)","intro":"Seperti tampilan biasa, shift harus dibuka sebelum nota disimpan. Di Classic dialognya bernama Kas Saldo Awal Kasir.","shots":[{"title":"Kas saldo awal","file":"guides/desktop/kasirb-buka-shift/01.webp","steps":["Nama kasir dan lokasi outlet yang membuka shift.","Isi uang kembalian yang ada di laci (saldo awal).","Klik Simpan Saldo Awal. Shift terbuka dan Anda bisa menyimpan nota."]}],"at":"/kasirb"},{"id":"kasirb-cari-barang","title":"Kasir Classic: Mencari dan menambah barang","intro":"Ketik kode atau nama barang, pilih dari daftar dengan panah keyboard, lalu Enter. Pindai barcode juga langsung memasukkan barangnya.","shots":[{"title":"Ketik di kolom Kode item","file":"guides/desktop/kasirb-cari-barang/01.webp","steps":["Isi QTY bila lebih dari satu (kosong = 1).","Ketik sebagian nama atau kode barang. Daftar muncul di bawahnya.","Gunakan panah atas/bawah untuk menyorot barang, lalu Enter untuk memasukkannya. Terlihat stok dan harga setiap barang. Esc menutup daftar."],"tip":"Memindai barcode tidak perlu memilih apa pun: barang langsung masuk saat scanner mengirim Enter."},{"title":"Barang masuk tabel keranjang","file":"guides/desktop/kasirb-cari-barang/02.webp","steps":["Barang masuk baris pertama (sejumlah QTY). Barang yang sama ditambahkan jumlahnya, bukan baris baru.","Total langsung diperbarui.","Jumlah item (baris) dan jumlah QTY ikut bertambah."]},{"title":"Daftar Barang dan Barang cepat","file":"guides/desktop/kasirb-cari-barang/03.webp","steps":["Tombol Daftar Barang (F2) membuka daftar barang tanpa mengetik. Klik barang untuk memasukkannya.","Barang cepat: klik slot terisi untuk memasukkan barang; klik kanan untuk mengganti atau mengosongkan; slot kosong (+) untuk mengisi."]}],"at":"/kasirb"},{"id":"kasirb-keranjang","title":"Kasir Classic: Mengatur tabel keranjang","intro":"Tabel keranjang menampilkan kode, nama, QTY, satuan, harga, diskon, dan sub total. Jumlah bisa diketik langsung di barisnya.","shots":[{"title":"Kolom dan tombol di setiap baris","file":"guides/desktop/kasirb-keranjang/01.webp","steps":["Ubah QTY langsung di tabel. Enter pindah ke baris berikutnya; panah atas/bawah naik-turun baris.","Harga per satuan (harga normal atau hasil perubahan).","Sub total baris.","Ubah harga atau beri potongan (Ctrl+E). Butuh PIN Owner/Supervisor.","Hapus baris (Ctrl+Delete)."],"tip":"Ctrl+↑ / Ctrl+↓ memilih baris, Ctrl dan + / − mengubah jumlah baris terpilih."},{"title":"Cari di keranjang dan Perluas","file":"guides/desktop/kasirb-keranjang/02.webp","steps":["Cari barang di dalam keranjang (Ctrl+F). Esc atau Enter kembali ke kolom Kode item.","Tampilkan keranjang sebagai tabel ringkasan lengkap beserta total, biaya, dan pajak.","Perluas: sembunyikan kepala dan isian nota agar tabel lebih lega. Klik Ciutkan untuk kembali. Layar pendek otomatis diperluas."]},{"title":"Stok kurang dan hapus barang","file":"guides/desktop/kasirb-keranjang/03.webp","steps":["Jumlah melebihi stok: baris memerah dan nota tidak bisa disimpan sampai jumlahnya dikecilkan.","Ikon tong sampah: kosongkan seluruh keranjang.","Tombol Simpan nonaktif selama ada baris bermasalah."]},{"title":"Ubah harga atau potongan","file":"guides/desktop/kasirb-keranjang/04.webp","steps":["Ubah harga satuan untuk nota ini.","Atau beri potongan per satuan / seluruh baris.","Pilih penyetuju lalu masukkan PIN 6 digitnya.","Setujui & Terapkan."]}],"at":"/kasirb"},{"id":"kasirb-member-kupon","title":"Kasir Classic: Member, tukar poin, kupon, dan salesman","intro":"Di Classic, member dan salesman dipilih dari kolom isian di bagian atas.","shots":[{"title":"Memilih member (F4)","file":"guides/desktop/kasirb-member-kupon/01.webp","steps":["Cari dengan nama, kode, atau telepon member.","Klik member yang dimaksud."]},{"title":"Member, tukar poin, dan kupon","file":"guides/desktop/kasirb-member-kupon/02.webp","steps":["Member terpilih. Level dan saldo poinnya tampil di kanan bawah isian.","Tukar poin menjadi potongan.","Kupon belanja (Ctrl+K).","Poin yang akan didapat dari nota ini."],"tip":"Cara memakai dialog tukar poin dan kupon sama dengan tampilan Kasir biasa."},{"title":"Kupon belanja","file":"guides/desktop/kasirb-member-kupon/03.webp","steps":["Ketik atau pindai kode kupon.","Klik Pakai untuk memeriksa dan menerapkan."]},{"title":"Memilih salesman (F6)","file":"guides/desktop/kasirb-member-kupon/04.webp","steps":["Pilih salesman, atau kosongkan untuk Salesman Umum.","Klik Selesai."]}],"at":"/kasirb"},{"id":"kasirb-biaya-pajak","title":"Kasir Classic: Biaya lain-lain, pajak, dan keterangan","intro":"Isian ini ada di bagian bawah layar, di atas tombol aksi.","shots":[{"title":"Biaya, pajak, dan keterangan","file":"guides/desktop/kasirb-biaya-pajak/01.webp","steps":["Biaya tambahan (ongkir, bungkus). Ikut menambah total.","Rincian untuk beberapa jenis biaya (nama + jumlah, maksimal 20 baris).","Pajak Toko (persen ditampilkan di judulnya).","Pajak Negara.","HITUNG PAJAK: terapkan pajak. Nilainya muncul di dua kolom di kiri.","BATAL HITUNG: lepas pajak.","Keterangan nota; ikut tercetak di struk."]},{"title":"Rincian biaya lain-lain","file":"guides/desktop/kasirb-biaya-pajak/02.webp","steps":["Nama biaya.","Jumlahnya.","Tambah baris biaya lain.","Simpan rincian."]}],"at":"/kasirb"},{"id":"kasirb-pending","title":"Kasir Classic: Menyimpan nota pending","intro":"Parkir keranjang yang belum dibayar, layani pelanggan lain, lalu buka lagi.","shots":[{"title":"Parkir dengan F7","file":"guides/desktop/kasirb-pending/01.webp","steps":["Klik F7 - PENDING (atau tekan F7)."]},{"title":"Beri keterangan","file":"guides/desktop/kasirb-pending/02.webp","steps":["Keterangan agar mudah dikenali (boleh kosong).","Simpan Pending. Keranjang langsung kosong."]},{"title":"Daftar nota pending (F8)","file":"guides/desktop/kasirb-pending/03.webp","steps":["Ubah keterangan.","Buka: isi nota kembali ke keranjang (keranjang yang sedang berisi otomatis diparkir).","Hapus nota pending."],"tip":"Angka kuning di tombol F8 = jumlah nota pending. Nota pending tersimpan di komputer kasir ini."}],"at":"/kasirb"},{"id":"kasirb-bayar","title":"Kasir Classic: Membayar dan menyimpan transaksi (Ctrl+S)","intro":"Simpan membuka dialog pembayaran yang sama dengan tampilan biasa: pilih Tunai, Kredit, Nontunai, atau Split, isi uang diterima, lalu simpan.","shots":[{"title":"Tombol Simpan (Ctrl+S)","file":"guides/desktop/kasirb-bayar/01.webp","steps":["Periksa total bersama pelanggan.","Klik Ctrl + S - Simpan (atau tekan Ctrl+S / F10). Bila shift belum dibuka, Anda diminta membukanya dulu."]},{"title":"Dialog pembayaran","file":"guides/desktop/kasirb-bayar/02.webp","steps":["F1 TUNAI, F2 KREDIT, F3 NONTUNAI, F4 SPLITCASH.","Isi uang yang diterima.","Kembalian dihitung otomatis.","Simpan Transaksi (tombol End)."],"tip":"Penjelasan lengkap Nontunai (transfer, kartu, QRIS), Split, dan Kredit ada di panduan \"Kasir: Membayar dan menyimpan transaksi\"; dialognya sama persis."},{"title":"Transaksi berhasil","file":"guides/desktop/kasirb-bayar/03.webp","steps":["Nomor nota.","Total, uang diterima, dan kembalian.","Transaksi Baru: siap untuk pelanggan berikutnya.","Cetak struk atau cetak ulang."],"tip":"Gambar memakai nomor nota contoh."}],"at":"/kasirb"},{"id":"kasirb-hari-ini-shift","title":"Kasir Classic: Penjualan hari ini, kas kecil, dan tutup shift","intro":"Ketiganya ada di tombol bawah layar.","shots":[{"title":"Penjualan hari ini (F9)","file":"guides/desktop/kasirb-hari-ini-shift/01.webp","steps":["Cari nota dengan nomor transaksi.","Cetak rekap penjualan Anda.","Lihat detail nota.","Cetak ulang struk."]},{"title":"Kas kecil","file":"guides/desktop/kasirb-hari-ini-shift/02.webp","steps":["Kas keluar atau Kas masuk.","Jumlah uang.","Simpan. Kas keluar di atas batas butuh PIN."]},{"title":"Tutup shift","file":"guides/desktop/kasirb-hari-ini-shift/03.webp","steps":["Isi hasil hitung fisik per metode (tunai dan bukti non-tunai).","Isi sama dengan angka sistem bila cocok.","Tutup Shift. Selisih wajib dicatat dan disetujui PIN."]}],"at":"/kasirb"},{"id":"kasirb-shortcut","title":"Kasir Classic: Tombol pintas dan mode Perluas","intro":"Classic dirancang untuk keyboard. Tombol di bagian bawah layar menampilkan shortcut-nya.","shots":[{"title":"Daftar shortcut (F1)","file":"guides/desktop/kasirb-shortcut/01.webp","steps":["F2 cari, F3 QTY, F4 member, F6 salesman, Ctrl+K kupon, F7 pending, F8 daftar pending, F9 hari ini, F5 segarkan, Ctrl+F cari di keranjang, Ctrl+S atau F10 simpan.","Ctrl+↑/↓ pilih baris, Ctrl dan + / − ubah jumlah, Ctrl+E ubah harga, Ctrl+Delete hapus.","F1 Tunai, F2 Kredit, F3 Nontunai, F4 Split, End simpan."]},{"title":"Mode Perluas","file":"guides/desktop/kasirb-shortcut/02.webp","steps":["Mode Perluas: kepala dan isian nota disembunyikan, tabel keranjang lebih tinggi. Klik Ciutkan untuk kembali. Pilihan diingat.","Tombol pindah ke Tampilan Kasir tetap ada di baris Kode item. Tombol Keluar ada di bilah bawah."]}],"at":"/kasirb"},{"id":"kasir-batalkan-nota","title":"Kasir: Membatalkan nota yang sudah tersimpan","intro":"Nota yang salah bisa dibatalkan oleh Owner/Supervisor. Stok, poin, dan kupon nota dikembalikan. Nota tetap tercatat berstatus Dibatalkan dan tidak bisa dipulihkan. Untuk memperbaiki isi nota, gunakan Edit nota.","shots":[{"title":"Buka nota dari daftar penjualan","file":"guides/desktop/kasir-batalkan-nota/01.webp","steps":["Cari nota dengan nomor nota.","Klik nomor nota yang akan dibatalkan."]},{"title":"Klik Batalkan nota","file":"guides/desktop/kasir-batalkan-nota/02.webp","steps":["Edit nota: untuk membetulkan isi nota (qty, harga) tanpa membatalkannya.","Batalkan nota: membatalkan seluruh nota."]},{"title":"Isi alasan dan persetujuan","file":"guides/desktop/kasir-batalkan-nota/03.webp","steps":["Tulis alasan pembatalan (wajib).","Pilih Owner/Supervisor yang berizin menyetujui pembatalan.","Masukkan PIN 6 digit milik penyetuju.","Klik tombol Batalkan nota. Tombol aktif setelah alasan, penyetuju, dan PIN terisi."],"tip":"Penyetuju dan PIN diatur di menu PIN Penyetuju. Pembatalan tercatat di audit."}],"at":"/sales"},{"id":"item-data-dasar","title":"Item: mengisi data barang dengan lengkap","intro":"Selain nama, satuan, dan harga, form barang punya isian lain yang berguna: kode, barcode, pembeda, berat, batas stok, klasifikasi, dan jenis barang. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Data barang","file":"guides/desktop/item-data-dasar/01.webp","steps":["Nama barang (wajib). Tulis yang mudah dikenali kasir.","Kode barang. Kosongkan agar dibuat otomatis (ITM-000001, dst.). Boleh huruf, angka, titik, garis.","Barcode / QR: arahkan pemindai ke kolom ini lalu pindai barangnya.","Pembeda: isi bila ada barang lain berbarcode sama (mis. negara asal) supaya kasir bisa membedakan.","Berat dalam gram (opsional).","Batas stok minimum: Dashboard memberi peringatan bila stok ≤ angka ini.","Satuan dasar (wajib), mis. Pcs, Botol, Kg. Jumlah stok dan harga grosir dihitung dalam satuan ini."],"tip":"Barcode yang sama dengan barang lain tetap boleh. Form akan memperingatkan dan meminta Anda mencentang konfirmasi \"barcode ini memang kembar\"."},{"title":"Harga dan status","file":"guides/desktop/item-data-dasar/02.webp","steps":["Harga pokok awal (modal). Setelah itu berubah otomatis oleh pembelian (rata-rata dan terakhir). Saat mengubah barang, kolom ini berubah menjadi keterangan saja.","Harga jual satuan: harga default semua cabang.","Status barang: Aktif bisa dijual; Nonaktif disembunyikan dari pilihan."]},{"title":"Klasifikasi","file":"guides/desktop/item-data-dasar/03.webp","steps":["Kategori: pengelompokan utama untuk filter dan laporan.","Brand / merek.","Principal: pemilik merek atau distributor utama.","Suplier utama barang ini."],"tip":"Isian ini dikelola di menu Data Pendukung (Kategori, Brand, Principal) dan Suplier. Ketik untuk mencari lalu pilih."},{"title":"Pengaturan barang","file":"guides/desktop/item-data-dasar/04.webp","steps":["Jenis: Barang (punya stok) atau Jasa (tanpa stok, mis. ongkos servis).","Boleh dijual walau stok kosong: stok akan menjadi minus. Pakai hanya bila stok fisik sering belum tercatat.","Boleh dijual di bawah harga pokok (rugi). Bila tidak dicentang, kasir diperingatkan dan nota tidak bisa dibayar.","Klik Simpan bila semua sudah benar."]}],"at":"/items"},{"id":"item-harga-cabang","title":"Item: harga jual khusus cabang","intro":"Harga jual satuan berlaku untuk semua cabang. Bila satu cabang perlu harga berbeda, isi harga khusus untuk cabang itu saja.","shots":[{"title":"Harga per cabang","file":"guides/desktop/item-harga-cabang/01.webp","steps":["Harga default semua cabang.","Bagian Harga per cabang. Kolom kosong = cabang itu memakai harga default.","Isi harga khusus untuk cabang ini. Hanya cabang yang boleh Anda atur yang tampil."],"tip":"Di Daftar Item, barang dengan harga khusus diberi ikon toko kecil di samping harganya. Setiap perubahan harga tercatat di Riwayat Harga."}],"at":"/items"},{"id":"item-harga-grosir","title":"Item: mengatur harga grosir","intro":"Harga grosir otomatis dipakai kasir saat jumlah beli mencapai batas tertentu. Contoh: beli 6 ke atas harganya lebih murah. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Tambah tier grosir","file":"guides/desktop/item-harga-grosir/01.webp","steps":["Set default: berlaku untuk semua cabang.","Mulai jumlah: batas bawah tier, dalam satuan dasar. Di bawah tier pertama berlaku harga jual biasa.","Harga per satuan untuk SELURUH jumlah beli pada tier ini (bukan hanya selisihnya).","Rentang dihitung otomatis: 6–11 memakai tier ini, 12 ke atas memakai tier berikutnya.","Hapus tier yang tidak perlu.","Tambah tier lagi (maksimal 10 per set)."],"tip":"Harga harus makin murah untuk jumlah yang makin besar, dan jumlah awal tidak boleh sama. Bila tidak, form menolak saat disimpan. Tier terakhir berlaku sampai berapa pun jumlahnya."},{"title":"Harga grosir khusus cabang","file":"guides/desktop/item-harga-grosir/02.webp","steps":["Pilih cabang untuk membuat set grosir sendiri. Awalnya berisi salinan set default; tinggal ubah angkanya. Cabang yang punya set sendiri memakai set itu sepenuhnya, bukan gabungan dengan default. Klik Pakai default untuk mengembalikannya."],"tip":"Di kasir, pelanggan otomatis mendapat harga grosir; kasir cukup mengisi jumlah. Perubahan harga grosir tercatat di Riwayat Harga dengan label Grosir."}],"at":"/items"},{"id":"item-satuan-tambahan","title":"Item: satuan tambahan (konversi satuan)","intro":"Satu barang bisa dijual dengan beberapa satuan, mis. 1 Dus = 12 Pcs, lengkap dengan barcode dan harga sendiri. Stok tetap dihitung dalam satuan dasar. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Tambah satuan Dus","file":"guides/desktop/item-satuan-tambahan/01.webp","steps":["Satuan tambahan, mis. Dus. Tidak boleh sama dengan satuan dasar.","Isi: berapa satuan dasar dalam satu satuan ini. 12 berarti 1 Dus = 12 Pcs.","Barcode satuan (opsional): memindai barcode ini di kasir langsung memasukkan 1 Dus.","Harga jual satuan ini. Kosong = isi × harga satuan dasar (otomatis).","Hapus satuan tambahan.","Tambah satuan lain (maksimal 5)."],"tip":"Di kasir, stok berkurang sesuai isi: menjual 1 Dus mengurangi 12 Pcs. Satuan dan barcode tidak boleh ganda."}],"at":"/items"},{"id":"item-gambar-barang","title":"Item: menambah gambar barang","intro":"Gambar membantu kasir mengenali barang di layar Kasir. Satu barang bisa punya beberapa gambar; salah satunya menjadi gambar utama.","shots":[{"title":"Pilih gambar","file":"guides/desktop/item-gambar-barang/01.webp","steps":["Klik Tambah gambar lalu pilih file JPG, PNG, atau WebP (maksimal 10 MB per gambar, boleh beberapa sekaligus).","Pilih gambar utama: ini yang tampil di kartu barang kasir dan daftar item.","Hapus gambar yang salah pilih."],"tip":"Pada barang baru, gambar diunggah setelah barang disimpan. Pada barang yang sudah ada, gambar langsung diunggah dan bisa dihapus atau dijadikan utama kapan saja. Klik gambar untuk memperbesar."}],"at":"/items"},{"id":"item-keterangan","title":"Item: keterangan barang dengan format","intro":"Keterangan menyimpan deskripsi barang: komposisi, aturan pakai, dan sebagainya. Mendukung format sederhana (markdown).","shots":[{"title":"Tulis keterangan","file":"guides/desktop/item-keterangan/01.webp","steps":["Tulis keterangan. **tebal**, *miring*, daftar dengan tanda -, dan tautan didukung.","Klik Pratinjau untuk melihat tampilannya."]},{"title":"Pratinjau","file":"guides/desktop/item-keterangan/02.webp","steps":["Kembali ke Tulis untuk mengubah."]}],"at":"/items"},{"id":"item-riwayat-harga","title":"Item: melihat riwayat perubahan harga","intro":"Setiap perubahan harga jual dan harga grosir dicatat: kapan, oleh siapa, dan dari berapa menjadi berapa. Harga pada nota lama tidak berubah.","shots":[{"title":"Buka barang","file":"guides/desktop/item-riwayat-harga/01.webp","steps":["Klik ikon pensil pada barang."]},{"title":"Riwayat Harga","file":"guides/desktop/item-riwayat-harga/02.webp","steps":["Riwayat Harga ada di bagian bawah halaman ubah barang. Kolomnya: waktu, berlaku untuk (semua cabang atau cabang tertentu), harga sebelum dan sesudah, dan siapa yang mengubah."],"tip":"Label Grosir menandai perubahan tier grosir, dan Harga awal menandai harga saat barang dibuat. Menu Riwayat Harga Jual juga menampilkan perubahan semua barang sekaligus."}],"at":"/items"},{"id":"item-daftar-fitur","title":"Item: filter dan kolom di daftar item","intro":"Selain mencari dan memfilter status, Daftar Item punya filter kategori, gambar yang bisa diperbesar, dan penomoran halaman.","shots":[{"title":"Filter dan kolom","file":"guides/desktop/item-daftar-fitur/01.webp","steps":["Cari nama, kode, atau barcode.","Filter status barang.","Filter kategori.","Ubah barang. Barang yang tidak boleh Anda ubah hanya bisa dilihat."]}],"at":"/items"},{"id":"master-satuan","title":"Mengelola satuan","intro":"Satuan adalah ukuran jual barang: Pcs, Botol, Kg, Dus, dan sebagainya. Data ini dipilih saat mengisi barang. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Daftar satuan","file":"guides/desktop/master-satuan/01.webp","steps":["Cari berdasarkan nama.","Klik tombol Tambah untuk membuat satuan baru.","Ikon pensil: ubah nama.","Ikon arsip: nonaktifkan agar tidak muncul di pilihan. Data lama tidak dihapus, dan bisa diaktifkan lagi."]},{"title":"Isi nama satuan","file":"guides/desktop/master-satuan/02.webp","steps":["Tulis nama satuan, mis. \"Botol\".","Klik Simpan."],"tip":"Nama tidak boleh sama dengan yang sudah ada."}],"at":"/units"},{"id":"master-kategori","title":"Mengelola kategori barang","intro":"Kategori mengelompokkan barang untuk pencarian dan laporan. Data ini dipilih saat mengisi barang. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Daftar kategori barang","file":"guides/desktop/master-kategori/01.webp","steps":["Cari berdasarkan nama.","Klik tombol Tambah untuk membuat kategori barang baru.","Ikon pensil: ubah nama.","Ikon arsip: nonaktifkan agar tidak muncul di pilihan. Data lama tidak dihapus, dan bisa diaktifkan lagi."]},{"title":"Isi nama kategori barang","file":"guides/desktop/master-kategori/02.webp","steps":["Tulis nama kategori barang, mis. \"Minuman\".","Klik Simpan."],"tip":"Nama tidak boleh sama dengan yang sudah ada."}],"at":"/categories"},{"id":"master-brand","title":"Mengelola brand","intro":"Brand adalah merek barang. Data ini dipilih saat mengisi barang. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Daftar brand","file":"guides/desktop/master-brand/01.webp","steps":["Cari berdasarkan nama.","Klik tombol Tambah untuk membuat brand baru.","Ikon pensil: ubah nama.","Ikon arsip: nonaktifkan agar tidak muncul di pilihan. Data lama tidak dihapus, dan bisa diaktifkan lagi."]},{"title":"Isi nama brand","file":"guides/desktop/master-brand/02.webp","steps":["Tulis nama brand, mis. \"Kopi Nusantara\".","Klik Simpan."],"tip":"Nama tidak boleh sama dengan yang sudah ada."}],"at":"/brands"},{"id":"master-principal","title":"Mengelola principal","intro":"Principal adalah pemilik merek atau distributor utama barang. Data ini dipilih saat mengisi barang. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Daftar principal","file":"guides/desktop/master-principal/01.webp","steps":["Cari berdasarkan nama.","Klik tombol Tambah untuk membuat principal baru.","Ikon pensil: ubah nama.","Ikon arsip: nonaktifkan agar tidak muncul di pilihan. Data lama tidak dihapus, dan bisa diaktifkan lagi."]},{"title":"Isi nama principal","file":"guides/desktop/master-principal/02.webp","steps":["Tulis nama principal, mis. \"PT Sumber Rasa\".","Klik Simpan."],"tip":"Nama tidak boleh sama dengan yang sudah ada."}],"at":"/principals"},{"id":"master-level-member","title":"Mengatur level member dan poin","intro":"Level member menentukan cara member mengumpulkan dan menukar poin. Contoh ini hanya diisi, tidak disimpan.","shots":[{"title":"Daftar level","file":"guides/desktop/master-level-member/01.webp","steps":["Klik tombol Tambah untuk membuat level baru.","Ubah level."]},{"title":"Isi aturan level","file":"guides/desktop/master-level-member/02.webp","steps":["Nama level, mis. Gold.","Poin minimum agar member naik ke level ini. Level dasar selalu mulai dari 0.","Setiap belanja sebesar ini member mendapat 1 poin (mis. Rp 10.000 = 1 poin). Isi 0 bila level ini tidak mengumpulkan poin.","Nilai tukar 1 poin dalam rupiah saat dipakai sebagai potongan di kasir (mis. 1 poin = Rp 100). Isi 0 bila poin tidak bisa ditukar.","Klik Simpan."]}],"at":"/member-levels"},{"id":"master-metode const $=s=>document.querySelector(s);let mode='desktop';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// lokasi (Grup › Menu) tiap halaman/panduan untuk breadcrumb
const LOC={};TREE.forEach(g=>g.parents.forEach(p=>p.entries.forEach(e=>{const l=g.title+' › '+p.title;if(e.page!==null)LOC['p'+e.page]=l;e.guides.forEach(k=>LOC['g'+k]=l)})));
function menu(){const q=$('#q').value.toLowerCase();const open=!!q;let h='';
 for(const g of TREE){let gh='';
  for(const p of g.parents){let eh='';
   for(const e of p.entries){const hitE=!q||e.title.toLowerCase().includes(q)||(p.title.toLowerCase().includes(q));
    const gs=e.guides.filter(k=>!q||hitE||GUIDES[k].title.toLowerCase().includes(q));
    if(!hitE&&!gs.length)continue;
    const cls=p.entries.length>1?'sub':'';
    eh+=(e.page!==null?'<a class="'+cls+'" href="#p'+e.page+'" data-k="p'+e.page+'">'+esc(e.title)+'</a>':'<div class="'+cls+'" style="padding:5px 9px;font-size:14px;color:var(--mute)">'+esc(e.title)+'</div>')
     +gs.map(k=>'<a class="g '+(p.entries.length>1?'lvl2':'sub')+'" href="#g'+k+'" data-k="g'+k+'">'+esc(GUIDES[k].title)+'</a>').join('')}
   if(!eh)continue;
   gh+=p.entries.length===1?eh.replace(/class="sub"/,'class=""'):'<details'+(open?' open':'')+'><summary>'+esc(p.title)+'</summary>'+eh+'</details>'}
  if(gh)h+='<h2>'+esc(g.title)+'</h2>'+gh}
 $('#menu').innerHTML=h||'<p class="path">Tidak ada hasil.</p>';mark()}
function mark(){const k=(location.hash||'#p0').slice(1);document.querySelectorAll('nav a').forEach(a=>{const on=a.dataset.k===k;a.classList.toggle('on',on);if(on){const d=a.closest('details');if(d)d.open=true}})}
function chips(t,a){return a.length?'<div class="card"><h3>'+t+'</h3><div class="chips">'+a.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div>':''}
function related(k,type){let out='';
 for(const g of TREE)for(const p of g.parents)for(const e of p.entries){if(type==='p'&&e.page===+k&&e.guides.length)out='<div class="card rel"><h3>Panduan untuk halaman ini</h3>'+e.guides.map(x=>'<a href="#g'+x+'">① '+esc(GUIDES[x].title)+'</a>').join('')+'</div>';
  if(type==='g'&&e.guides.includes(+k)&&e.page!==null)out='<div class="card rel"><h3>Halaman terkait</h3><a href="#p'+e.page+'">'+esc(PAGES[e.page].title)+' <span class="path">'+esc(PAGES[e.page].href)+'</span></a></div>'}
 return out}
function guide(k){const x=GUIDES[k];return '<div class="crumb">'+esc(LOC['g'+k]||'')+'  ·  Panduan</div><h2 class="t">'+esc(x.title)+'</h2><p>'+esc(x.intro)+'</p>'
 +x.shots.map((s,n)=>'<div class="card"><h3>Gambar '+(n+1)+': '+esc(s.title)+'</h3><div class="shot"><img loading="lazy" alt="'+esc(s.title)+'" src="'+s.file+'"></div>'+s.steps.map((t,i)=>'<div class="step"><b>'+(i+1)+'</b><span>'+esc(t)+'</span></div>').join('')+(s.tip?'<p class="path">💡 '+esc(s.tip)+'</p>':'')+'</div>').join('')+related(k,'g')}
function page(i){const p=PAGES[i];
 const intro=p.note||('Halaman <b>'+esc(p.title)+'</b>'+(p.heading&&p.heading!==p.title?' ('+esc(p.heading)+')':'')+'.'+(p.columns.length?' Data ditampilkan dalam tabel dengan kolom di bawah.':'')+(p.buttons.length?' Aksi yang tersedia ada pada tombol di bawah.':''));
 return '<div class="crumb">'+esc(LOC['p'+i]||'')+'</div><h2 class="t">'+esc(p.title)+'</h2><div class="path">'+esc(p.href)+'</div>'
 +'<p>'+(p.note?esc(intro):intro)+'</p>'
 +'<div class="tabs"><button data-m="desktop" class="'+(mode==='desktop'?'on':'')+'">Komputer</button><button data-m="mobile" class="'+(mode==='mobile'?'on':'')+'">HP</button></div>'
 +'<div class="shot '+(mode==='mobile'?'m':'')+'"><img loading="lazy" alt="Tampilan '+esc(p.title)+'" src="'+(mode==='mobile'?p.mobile:p.desktop)+'"></div>'
 +related(i,'p')+chips('Tombol &amp; aksi',p.buttons)+chips('Kolom tabel',p.columns)+chips('Isian formulir',p.fields)}
function show(){const h=(location.hash||'#p0').slice(1);const t=h[0],k=+h.slice(1);
 $('#view').innerHTML=(t==='g'&&GUIDES[k])?guide(k):page(PAGES[k]?k:0);
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;show()});mark();scrollTo(0,0)}
$('#q').oninput=menu;addEventListener('hashchange',show);menu();show();
