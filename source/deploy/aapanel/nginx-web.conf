# Situs: arus.erayadigital.co.id  (root: /www/wwwroot/arus/web; tempel di dalam blok server { }, setelah SSL aktif)

# Fallback SPA: refresh /items atau tautan reset password tidak boleh 404.
location / {
    try_files $uri $uri/ /index.html;
}

# Berkas ber-hash boleh di-cache lama; index.html tidak (agar rilis baru langsung terpakai).
location ^~ /_app/immutable/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
