# Situs: arus.erayadigital.co.id  (root: /www/wwwroot/arus/web; tempel di dalam blok server { }, setelah SSL aktif)

# Fallback SPA: refresh /items atau tautan reset password tidak boleh 404.
location / {
    try_files $uri $uri/ /index.html;
}

# Berkas ber-hash boleh di-cache lama; index.html tidak (agar rilis baru langsung terpakai).
location ^~ /_app/immutable/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
# Aset build lain yang hilang (tab lama setelah rilis baru): 404, jangan dijawab index.html.
location ^~ /_app/ {
    try_files $uri =404;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Landing page tenant (/s/<slug>) dilayani API sebagai HTML statis; teruskan agar alamatnya bisa https://arus.../s/<slug>.
# Aset halaman (css/gambar/tailwind) ada di /public/s/ dan /public/s-assets/ pada origin yang sama. Aktifkan lalu build web dengan
# VITE_PUBLIC_PAGE_ORIGIN=https://arus.erayadigital.co.id agar editor menampilkan alamat ini.
location ^~ /s/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /public/s {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
