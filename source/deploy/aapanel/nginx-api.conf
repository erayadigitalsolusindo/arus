# Situs: arus-api.erayadigital.co.id  (aaPanel → Website → Settings → Config; tempel di dalam blok server { }, setelah SSL aktif)
# Jangan pakai fitur "Reverse proxy" bawaan sekaligus dengan ini — pilih salah satu.

client_max_body_size 12m;   # unggah gambar item (maks 10 MB mentah)

# Unggah APK Kasir (Platform Admin): jalur khusus agar batas 12m di atas tidak berlaku. Harus sama/lebih dari MaxAPKBytes (150 MB).
location = /platform/mobile/apk {
    client_max_body_size 160m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;   # alirkan ke API, jangan tampung 150 MB di disk proxy
}

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 120s;      # unggahan lewat jaringan seluler
    proxy_request_buffering on;
}
