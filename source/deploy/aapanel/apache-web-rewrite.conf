# Situs web (Apache aaPanel) -> Website -> situs arus... -> URL rewrite. Fallback SPA: refresh /items tidak boleh 404.
# Pakai %{DOCUMENT_ROOT}%{REQUEST_URI}, BUKAN %{REQUEST_FILENAME}: di konteks vhost REQUEST_FILENAME
# membuat semua berkas (termasuk /_app/...) dianggap tidak ada -> CSS/JS diganti index.html -> halaman putih.
RewriteEngine On
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule . /index.html [L]
