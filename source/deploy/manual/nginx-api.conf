# /etc/nginx/sites-available/arus-api  → symlink ke sites-enabled. Certbot menambah blok SSL + redirect HTTPS otomatis.
server {
    listen 80;
    listen [::]:80;
    server_name arus-api.erayadigital.co.id;

    client_max_body_size 12m;   # unggah gambar item (maks 10 MB mentah)
    server_tokens off;

    # Unggah APK Kasir (Platform Admin): jalur khusus agar batas 12m di atas tidak berlaku (harus >= MaxAPKBytes, 150 MB).
    location = /platform/mobile/apk {
        client_max_body_size 160m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # dibaca API bila TRUST_PROXY=true
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 120s;      # unggahan lewat jaringan seluler
    }
}
